services:
  # --- BACKEND (FastAPI + Scipy) ---
  backend:
    build: 
      context: ./backend
    container_name: network_backend
    # gunicorn with 4 workers (this Mac has 8 cores, keep the number of workers low at the moment)
    command: gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --reload 
    volumes:
      - ./backend:/app  # automatic reload of the code with the container without need to recompile
      - .:/workspace
    ports:
      - "8000:8000"     # optional: for testing in dev without nginx
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0 # env variable for Redis
    depends_on:
      - redis  # making sure that redis starts before the backend

  # --- REDIS --- #
  redis:
    image: redis:alpine
    container_name: network_redis
    ports:
      - "6379:6379"

  # --- FRONTEND (Vue + Vite) ---
  frontend:
    build: 
      context: ./frontend
    container_name: network_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app           # code sync
      - /app/node_modules         # avoids node_modules overwriting the one in the container
    ports:
      - "5173:5173"               # necessary for Vite 

  # --- NGINX (Reverse Proxy) ---
  nginx:
    image: nginx:alpine
    container_name: network_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"  # port 80 redirects all the traffic
    depends_on:
      - backend
      - frontend