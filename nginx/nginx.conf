events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    # allows sending of files with HTTP request
    sendfile on;
    # max size of the HTTP request: 100MB
    client_max_body_size 100M;  
    # defining server names
    upstream frontend_server {
        server frontend:5173;
    }

    upstream backend_server {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # --- frontend and Vite ---
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # live update of the frontend
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- backend ---
        # all calls to /api/ are redirected to the backend
        location /api/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # extended timeout for long computations (maybe needed to be larger)
            proxy_read_timeout 10800s;
            proxy_connect_timeout 10800s;
        }
    }
}