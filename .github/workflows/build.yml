name: VIPNODES Desktop Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- SETUP SYSTEM DEPENDENCIES (LINUX) ---
      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev gfortran libfuse2

      # --- BUILD BACKEND (WINDOWS) ---
      - name: Build Backend (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd backend
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2.0.0,>=1.24.0"
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --name backend-api --onedir --clean `
            --collect-all numpy `
            --collect-all networkx `
            --collect-all sknetwork `
            --collect-all scipy `
            --collect-all fa2 `
            --collect-all primme `
            --collect-all uvicorn `
            --collect-all anyio `
            --collect-all starlette `
            --collect-all fastapi `
            --hidden-import uvicorn `
            --hidden-import uvicorn.config `
            --hidden-import uvicorn.main `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.lifespan.off `
            --hidden-import anyio._backends._asyncio `
            --hidden-import multipart `
            --hidden-import python-multipart `
            main.py

      # --- BUILD BACKEND (LINUX) ---
      - name: Build Backend (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd backend
          python3 -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2.0.0,>=1.24.0"
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --name backend-api --onedir --clean \
            --collect-all numpy \
            --collect-all networkx \
            --collect-all sknetwork \
            --collect-all scipy \
            --collect-all fa2 \
            --collect-all primme \
            --collect-all uvicorn \
            --collect-all anyio \
            --collect-all starlette \
            --collect-all fastapi \
            --hidden-import uvicorn \
            --hidden-import uvicorn.config \
            --hidden-import uvicorn.main \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.loops.asyncio \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.http.h11_impl \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import uvicorn.lifespan.off \
            --hidden-import anyio._backends._asyncio \
            --hidden-import multipart \
            --hidden-import python-multipart \
            main.py

      # --- SETUP NODE.JS ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- BUILD FRONTEND & ELECTRON ---
      - name: Build Electron App
        shell: bash
        run: |
          cd frontend
          npm install
          npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- SAVE ARTIFACTS ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VIPNODES-${{ matrix.os }}
          path: |
            frontend/release/*.exe
            frontend/release/*.AppImage
            frontend/release/*.deb