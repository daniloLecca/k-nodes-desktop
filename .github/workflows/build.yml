name: VIPNODES Desktop Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- SETUP SYSTEM DEPENDENCIES (LINUX) ---
      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libblas-dev liblapack-dev gfortran libfuse2

      # --- BUILD BACKEND (WINDOWS) ---
      - name: Build Backend (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd backend
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path build) { Remove-Item -Recurse -Force build }

          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2.0.0,>=1.24.0"
          pip install -r requirements.txt
          pip install pyinstaller

          pyinstaller --clean backend-api.spec

          $exe = Get-Item dist\backend-api.exe
          Write-Host "Dimensione generata: $($exe.Length) bytes"
          if ($exe.Length -lt 80000000) {
            Write-Error "ERRORE: L'eseguibile e troppo piccolo ($($exe.Length) bytes), mancano pacchetti!"
            exit 1
          }

      # --- BUILD BACKEND (LINUX) ---
      - name: Build Backend (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          cd backend
          rm -rf dist build
          python3 -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2.0.0,>=1.24.0"
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller --clean backend-api.spec
          ls -lh dist/backend-api

      # --- SETUP NODE.JS ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --- BUILD FRONTEND & ELECTRON ---
      - name: Build Electron App
        shell: bash
        run: |
          cd frontend
          npm install
          npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- SAVE ARTIFACTS ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VIPNODES-${{ matrix.os }}
          path: |
            frontend/release/*.exe
            frontend/release/*.AppImage
            frontend/release/*.deb