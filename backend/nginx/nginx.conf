events {
    worker_connections 1024;
}

http {
    # Definizione dei server upstream (nomi dei servizi nel docker-compose)
    upstream frontend_server {
        server frontend:5173;
    }

    upstream backend_server {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # --- GESTIONE FRONTEND & VITE HMR (Hot Module Replacement) ---
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Configurazioni cruciali per i WebSocket (aggiornamento live Vue)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- GESTIONE API BACKEND ---
        # Le chiamate fatte a /api/ vengono girate al backend
        location /api/ {
            # Riscrive l'URL: /api/users diventa /users quando arriva a FastAPI
            rewrite ^/api/(.*) /$1 break;

            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Timeout aumentati per calcoli pesanti (analisi reti complesse)
            proxy_read_timeout 300s;
            proxy_connect_timeout 300s;
        }
    }
}