<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <script>
      (() => {
        const savedTheme = localStorage.getItem('vipnodes-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = savedTheme || (prefersDark ? 'dark' : 'light')
        // if theme was not updated with the toggle -> look in localStorage and update global variable

        // global variable definition
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/vipnodes-logo.png?v=2">
    <link rel="shortcut icon" href="/vipnodes-logo.png?v=2">
    <link rel="apple-touch-icon" href="/vipnodes-logo.png?v=2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPNODES</title>
    <meta name="keywords" content="
    Complex Networks, Numerical Analysis, Centrality Index, 
    Communicability, Starting Convenience, Nodes, Edges, Low Rank, Graph, 
    Visualization, Computation, Scientific Tool, Gauss Quadrature, ">
    <meta name="description" content="VIPNODES is an online tool for computing centrality measures in undirected, unweighted complex networks.">
    <meta name="author" content="Danilo Lecca">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
