<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Demo network preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="100%" stop-color="#d8ffe8"/>
    </linearGradient>
    <radialGradient id="node" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <g stroke="#0f766e" stroke-width="3" opacity="0.45">
    <line x1="130" y1="130" x2="300" y2="220"/>
    <line x1="300" y1="220" x2="470" y2="140"/>
    <line x1="470" y1="140" x2="640" y2="240"/>
    <line x1="640" y1="240" x2="820" y2="170"/>
    <line x1="210" y1="360" x2="360" y2="310"/>
    <line x1="360" y1="310" x2="520" y2="370"/>
    <line x1="520" y1="370" x2="720" y2="330"/>
    <line x1="300" y1="220" x2="360" y2="310"/>
    <line x1="470" y1="140" x2="520" y2="370"/>
    <line x1="640" y1="240" x2="520" y2="370"/>
    <line x1="130" y1="130" x2="210" y2="360"/>
  </g>

  <g>
    <circle cx="130" cy="130" r="16" fill="url(#node)"/>
    <circle cx="300" cy="220" r="20" fill="url(#node)"/>
    <circle cx="470" cy="140" r="18" fill="url(#node)"/>
    <circle cx="640" cy="240" r="22" fill="url(#node)"/>
    <circle cx="820" cy="170" r="16" fill="url(#node)"/>
    <circle cx="210" cy="360" r="17" fill="url(#node)"/>
    <circle cx="360" cy="310" r="21" fill="url(#node)"/>
    <circle cx="520" cy="370" r="24" fill="url(#node)"/>
    <circle cx="720" cy="330" r="19" fill="url(#node)"/>
  </g>

  <text x="42" y="500" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="28" fill="#0f172a" opacity="0.88">
    Local asset demo image
  </text>
